name: Documentation
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:

* documentation
  body:

* type: markdown
  attributes:
  value: |
  Help us keep the project's documentation accurate and useful.

* type: textarea
  id: issue
  attributes:
  label: Documentation Issue
  description: What is missing, incorrect, outdated, or unclear?
  placeholder: Describe the documentation problem...
  validations:
  required: true

* type: input
  id: location
  attributes:
  label: Location
  description: Provide the file, section, page, or URL if applicable.
  placeholder: "README.md, CONTRIBUTING.md, /docs/..., etc."

* type: textarea
  id: expected
  attributes:
  label: Expected Documentation
  description: What should be documented or changed?
  placeholder: Describe what the documentation should say...
  validations:
  required: true

* type: textarea
  id: context
  attributes:
  label: Additional Context
  description: Add references, examples, or other relevant information.
