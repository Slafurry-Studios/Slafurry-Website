name: Bug Report
description: Report something that is not working as expected
title: "[Bug]: "
labels:

* bug
  body:

* type: markdown
  attributes:
  value: |
  Thanks for taking the time to report a bug!

  ```
  Please provide enough information for us to reproduce and investigate the issue.
  ```

* type: textarea
  id: description
  attributes:
  label: Description
  description: Briefly describe what went wrong.
  placeholder: Tell us what happened...
  validations:
  required: true

* type: textarea
  id: reproduction
  attributes:
  label: Steps to Reproduce
  description: Provide clear steps that consistently reproduce the issue.
  placeholder: |
  1. Go to...
  2. Click...
  3. Observe...
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected Behavior
  description: What did you expect to happen?
  placeholder: Describe the expected behavior...
  validations:
  required: true

* type: textarea
  id: actual
  attributes:
  label: Actual Behavior
  description: What actually happened?
  placeholder: Describe what actually happened...
  validations:
  required: true

* type: dropdown
  id: browser
  attributes:
  label: Browser
  description: Which browser were you using when the issue occurred?
  options:
  - Chrome
  - Firefox
  - Safari
  - Edge
  - Other
  - Not applicable
  validations:
  required: false

* type: dropdown
  id: device
  attributes:
  label: Device
  description: Which type of device did you use?
  options:
  - Desktop
  - Laptop
  - Tablet
  - Mobile
  - Other
  validations:
  required: false

* type: input
  id: locale
  attributes:
  label: Locale
  description: Which website locale were you using?
  placeholder: "en or id"

* type: textarea
  id: screenshots
  attributes:
  label: Screenshots or Recordings
  description: Add screenshots or recordings if they help demonstrate the issue.

* type: textarea
  id: additional
  attributes:
  label: Additional Context
  description: Add logs, related issues, or any other relevant information.
