<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4efff;--dim:#9a8fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#120d1f;color:var(--ink);font-family:Bungee,Impact,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;max-height:720px;aspect-ratio:440/640;max-width:100%}
canvas{width:100%;height:100%;display:block;background:#1a1330;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(18,13,31,.9);padding:24px}
#ov h1{font-size:clamp(34px,9vw,54px);margin:0;line-height:1}
#ov p{font-family:system-ui,sans-serif;color:var(--dim);margin:0;font-size:15px;line-height:1.5;max-width:320px}
button{font:inherit;font-size:20px;padding:12px 28px;border:0;border-radius:10px;background:#ffb703;color:#1a1330;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="440" height="640"></canvas>
<div id="ov">
<h1 id="t">Drift Hero</h1>
<p id="m">Each of the 4 lanes lives its own life: it spins, flips direction and drifts around the screen. Notes ride straight along their lane to the ring. Hit them as they land.<br><br>Keys: D F J K, one per ring. On touch, tap the ring you want to hit.</p>
<button id="b">Start</button>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=440,H=640,L=170;
const COL=['#ff4d6d','#ffb703','#3ddc97','#4cc9f0'],LAB=['D','F','J','K'];
const PIV=[[110,210],[330,210],[110,430],[330,430]];
const REG=i=>{const c=i%2,r=i>>1;return [c?240:90,c?350:200,r?350:130,r?540:300]};
const pickT=i=>{const g=REG(i);return [g[0]+Math.random()*(g[1]-g[0]),g[2]+Math.random()*(g[3]-g[2])]};
const KEYS={d:0,f:1,j:2,k:3,arrowleft:0,arrowup:1,arrowdown:2,arrowright:3};
let lanes,notes,floats,score,combo,best=0,hp,t,spawnT,running,flash,press,hitsN,missN;
function reset(){
  lanes=[0,1,2,3].map(i=>{const [tx,ty]=pickT(i);return {a:Math.random()*6.28,dir:i%2?1:-1,dv:i%2?1:-1,w:.55+i*.18,flip:8+Math.random()*8,x:PIV[i][0],y:PIV[i][1],vx:0,vy:0,tx,ty,mt:6+i}});
  notes=[];floats=[];score=0;combo=0;hp=100;t=0;spawnT=1;flash=[0,0,0,0];press=[0,0,0,0];hitsN=0;missN=0;
}
function spawn(){
  const n=Math.random()<.15?2:1,used=[];
  for(let i=0;i<n;i++){
    let l=Math.floor(Math.random()*4);if(used.includes(l))continue;used.push(l);
    if(notes.some(o=>o.lane===l&&o.d>L-50))continue;
    notes.push({lane:l,d:L,done:false});
  }
}
function pop(txt,l,c){floats.push({txt,x:lanes[l].x,y:lanes[l].y-44,a:1,c})}
function tap(l){
  if(!running)return;
  press[l]=1;
  let b=null,bd=1e9;
  for(const n of notes){if(n.done||n.lane!==l)continue;const d=Math.abs(n.d);if(d<bd){bd=d;b=n}}
  if(b&&bd<30){
    b.done=true;b.hit=1;flash[l]=1;
    const p=bd<13;combo++;hitsN++;
    score+=(p?100:50)*(1+Math.floor(combo/10));hp=Math.min(100,hp+(p?2:1));
    pop(p?'PERFECT':'GOOD',l,p?'#fff':COL[l]);beep(p?660:520+l*40);
  }else{combo=0;hp-=4;pop('MISS',l,'#888');beep(120)}
}
let ac;function beep(f){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
function update(dt){
  t+=dt;
  const k=Math.min(2,.25+t*.02),speed=125+Math.min(110,t*1.8);
  const cap=Math.min(80,12+t*1.3);
  for(let i=0;i<4;i++){const q=lanes[i];
    q.mt-=dt;if(q.mt<=0){[q.tx,q.ty]=pickT(i);q.mt=Math.max(2.5,6.5-t*.03)+Math.random()*2.5}
    const dx=q.tx-q.x,dy=q.ty-q.y,dd=Math.hypot(dx,dy)||1,sp=Math.min(cap,dd*1.1);
    q.vx+=(dx/dd*sp-q.vx)*Math.min(1,dt*2.5);q.vy+=(dy/dd*sp-q.vy)*Math.min(1,dt*2.5);
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    q.flip-=dt;if(q.flip<=0){q.dir*=-1;q.flip=9+Math.random()*10}
    q.dv+=(q.dir-q.dv)*Math.min(1,dt*1.5);
    q.a+=q.dv*q.w*k*dt;
  }
  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=Math.max(.38,.75-t*.004)+Math.random()*.15}
  for(const n of notes){
    n.d-=speed*dt;
    if(!n.done&&n.d<-30){n.done=true;n.miss=1;combo=0;hp-=10;missN++;pop('MISS',n.lane,'#ff4d6d')}
  }
  notes=notes.filter(n=>n.d>-90&&!n.hit);
  for(const f of floats){f.y-=40*dt;f.a-=dt*1.6}
  floats=floats.filter(f=>f.a>0);
  for(let i=0;i<4;i++){flash[i]=Math.max(0,flash[i]-dt*5);press[i]=Math.max(0,press[i]-dt*8)}
  if(hp<=0)end();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<4;i++){
    const px=lanes[i].x,py=lanes[i].y,c=COL[i];
    ctx.save();ctx.translate(px,py);ctx.rotate(lanes[i].a);
    ctx.fillStyle=c;ctx.globalAlpha=.12+flash[i]*.3;rr(0,-28,L+22,56,14);ctx.fill();
    ctx.globalAlpha=.35;ctx.fillRect(0,-1,L+22,2);ctx.globalAlpha=1;
    for(const n of notes){
      if(n.lane!==i||n.hit)continue;
      ctx.globalAlpha=n.miss?.35:1;ctx.shadowColor=c;ctx.shadowBlur=12;ctx.fillStyle=c;rr(n.d-13,-22,26,44,7);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.55)';rr(n.d-9,-18,6,36,3);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.restore();
    ctx.beginPath();ctx.arc(px,py,30,0,6.283);
    ctx.fillStyle=c;ctx.globalAlpha=.25+press[i]*.65;ctx.fill();ctx.globalAlpha=1;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='22px Bungee,Impact,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(LAB[i],px,py+2);
  }
  ctx.textBaseline='alphabetic';ctx.font='16px Bungee,Impact,sans-serif';
  for(const f of floats){ctx.globalAlpha=Math.max(0,f.a);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)}
  ctx.globalAlpha=1;
  ctx.textAlign='left';ctx.fillStyle='#f4efff';ctx.font='22px Bungee,Impact,sans-serif';ctx.fillText(score,20,34);
  ctx.textAlign='right';ctx.fillStyle=combo>=10?'#ffb703':'#f4efff';ctx.fillText(combo>1?combo+' combo':'',W-20,34);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(20,46,400,6);
  ctx.fillStyle=hp>35?'#3ddc97':'#ff4d6d';ctx.fillRect(20,46,400*Math.max(0,hp)/100,6);
}
let last=0;
function loop(ts){
  if(!running)return;
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  update(dt);draw();if(running)requestAnimationFrame(loop);
}
const ov=document.getElementById('ov');
function start(){reset();ov.classList.add('hide');running=true;last=performance.now();requestAnimationFrame(loop)}
function end(){
  running=false;best=Math.max(best,score);
  document.getElementById('t').textContent='Game Over';
  document.getElementById('m').innerHTML='Score: '+score+'<br>Best: '+best+'<br>Hits: '+hitsN+' · Missed: '+missN;
  document.getElementById('b').textContent='Play again';
  ov.classList.remove('hide');document.getElementById('b').focus();
}
document.getElementById('b').onclick=start;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k in KEYS){e.preventDefault();if(!e.repeat)tap(KEYS[k])}
  else if((k==='enter'||k===' ')&&!running&&document.activeElement!==document.getElementById('b'))start();
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  let b=0,bd=1e9;lanes.forEach((q,i)=>{const d=Math.hypot(q.x-x,q.y-y);if(d<bd){bd=d;b=i}});tap(b);
});
reset();draw();
</script>
</body>
</html>
