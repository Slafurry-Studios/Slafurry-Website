version: "3.8"

services:
  postgres:
    image: postgres:15-alpine  # mayor versi yang sama dengan Supabase (saat ini 15)
    container_name: slafurry-postgres
    ports:
      - "5432:5432"            # gunakan 5433 di host jika 5432 sudah dipakai
    volumes:
      - slafurry_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: slafurry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slafurry"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  slafurry_postgres_data:
    name: slafurry_postgres_data
