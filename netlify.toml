[build]
  command = "npm run build"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's persistent build cache is stored for reuse between builds but is
  # never published, so it must not trip the secrets scanner.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
  # NEXT_PUBLIC_* values are intentionally inlined into the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_APP_URL"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
