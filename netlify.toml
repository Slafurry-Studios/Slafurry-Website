[build]
  command = "npm run build"
  publish = ".next"
  function_directory = ".netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's persistent build cache is stored for reuse between builds but is
  # never published, so it must not trip the secrets scanner.
  # Exclude all build output — Next.js inlines env values into bundles, which
  # would otherwise trip secrets scanning for AUTH_PROVIDER/STORAGE_PROVIDER.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**"
  # NEXT_PUBLIC_* values are intentionally inlined into the client bundle.
  # AUTH_PROVIDER/STORAGE_PROVIDER values (supabase) appear legitimately in
  # Prisma client, migrations, and docs — exclude them from secrets scanning.
  # AUTH_LOCAL_SECRET and NEXT_PUBLIC_RESEND_API_KEY values appear in build
  # output chunks — exclude them as well.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_APP_URL,AUTH_PROVIDER,STORAGE_PROVIDER,AUTH_LOCAL_SECRET,NEXT_PUBLIC_RESEND_API_KEY"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Reporting-Endpoints = "csp=\"/api/csp-reports\""
    # Report-only first: collect violations, then promote to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: *.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; report-to csp; report-uri /api/csp-reports"
